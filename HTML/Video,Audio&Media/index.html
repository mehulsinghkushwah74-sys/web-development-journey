<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video, Audio & Media</title>
</head>

<body>
    <video src="Video.mp4" controls></video>
    <!-- NOTE : 
    1. src - paht of the video
    2. controls - adds video control like,play,pause and volume.
    3. autoplay - automatically starts playing the video when the page load.
    4. muted - mutes the video by default.
    5. loop - repeats the video once it ends.
    6. poster - specifies an image to be displayed before the video start playing.
    7. width and height -->

    <audio src="mehul.mp3" controls></audio>
    <!-- NOTE : 
    1. src - paht of the video
    2. controls - adds video control like,play,pause and volume.
    3. autoplay - automatically starts playing the video when the page load.
    4. muted - mutes the audio by default.
    5. loop - repeats the audio once it ends.
    6. preload -->

    <iframe src="https://unsplash.com/s/photos/dark" frameborder="0" height="300px"></iframe>

    <!-- NOTE : iframe is used for the embeding the website -->
</body>

</html>
