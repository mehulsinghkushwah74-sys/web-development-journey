<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#Tables</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <table> <!-- table tag ka use hai ki ye ek table bna deta hai -->
        <caption>Employee Details</caption> <!-- caption use hota hai ki ye kis chiz ke liye table hai -->
        <thead>
            <tr> <!-- tr stands for the table row  -->
                <th>Hello</th> <!-- th stands for table heading ye text ko heading me change kr deta hai -->
                <th>Mehul</th>
                <th>Programmer</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>HTML</td> <!-- td stands for the teble design and the first td follows the first th -->
                <td colspan="1">CSS</td> <!-- colspan means ki ye td kitni coloum ki jgh lega -->
                <td rowspan="1">JAVA </td> <!-- rowspan means ki ek td kitni row lega -->
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>HTML</td> <!-- td stands for the teble design and the first td follows the first th -->
                <td colspan="1">CSS</td> <!-- colspan means ki ye td kitni coloum ki jgh lega -->
                <td rowspan="1">JAVA </td>
            </tr>
        </tfoot>
        <!-- Theader Tfooter and tbody se humne grouping kr di hai bss -->
    </table>
    <!-- LIST -->
    <!-- Now we are learning about the different types of lists  -->
    <!-- list are mostly three types 1.Ordered 2. Unordered and 3.Defination list. -->
    <ul type="square"> <!-- ul is stand for the unordered list -->
        <li>maynk</li> <!-- li stands for the list -->
        <li>mehul</li>
        <li>raghav</li>
    </ul>
    <ol type="A"> <!-- ol is stands for the ordered list -->
        <!-- NOTE : 1. type = "I" is for the roman number in upper case and "i" is for the lower case
                    2. type = "A" is for the alphabet in upper case and "a" in lower case -->
        <li>maynk</li> <!-- li stands for the list -->
        <li>mehul</li>
        <li>raghav</li>
    </ol>
    <dl> <!-- dl is for the defination list -->
        <dt>hello</dt> <!-- dt is for the defination term -->
        <dd>mama</dd> <!-- dd is for defination's defination -->

    </dl>
</body>

</html>
