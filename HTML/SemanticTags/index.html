<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tags</title>
</head>

<body>
    <!-- NOTE  : 1. Header - used to represent the top section of web page contains headings,logos, and navigation bar.
            2. nav - signifies a navigation menu on a web page.
            3. article - indicates a self contain piece of content on a web page.
            4. section - represents a themantic grouping of content.
            5. aside - typically used for sidebars or content that is tangentially related to the main content.
            6. footer - represents the footer of a web page, usually containing copyright information and contact details.
            7. figure - used for embeding images, diagrams, or charts,along with a caption.
            8. main - Signifies the main content area of a web page.
            9. time - Used to represents time-related information, like dates and time.  -->

    <header>
        <nav>
            <ul type="square">
                <li>home</li>
                <li>mehul</li>
                <li>ghar</li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>What are the semantic tags</h1>
    </main>

    <footer>
        <h2>Thank you</h2>
    </footer>

</body>

</html>
