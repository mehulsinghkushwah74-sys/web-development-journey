<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS GRID</title>
    <style>
        .container{
            border: 2px solid black;
            display: grid;
            /* ise ek grid ban jati hai  */
            grid-template-columns: 120px 150px;
            /* isee do colounm ban gye hai ek 120px ka or 150px ka  */
            grid-template-rows: 100px 100px 100px;
        }
        .item{
            border: 2px solid red;
            height: 55px;
            width: 55px;
        }
        .item4,.item1{
            /* grid-row: 1/2; */
            grid-column: 1/2;
            /* or  */
            grid-row-start: 1;
            grid-row-end : 3;
            /* ye like is row se lekr uss row ya column tak chle jao */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class=" item1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item4">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
