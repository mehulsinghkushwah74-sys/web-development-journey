    <meta charset="UTF-8">

    <title>CSS FlexBox</title>
    <style>
        .container{
            border: 2px solid red;
            display: flex;
            height: 80vh;
            justify-content:flex-start;
            /* justify-content: ; se hum bhot tarike se items ko arrange kr skte hai  */
            /* align-items: center; */
            /* flex-direction: column; isse ye hoga ki jo items wo ek coloums me aa jayenge */
            /* flex-direction: column-reverse; isse ye hoga ki sabse upar item hoga niche and sabse niche wala sabse upar  */
            
            /* flex-direction: row; same as the cloumns  */

            /* justify-content: center; main axis ke around center krega and main axis flex direction hoti hai for example flex-direction: column; and we use justify content center than it will center about the vertical line  */
            flex-wrap: wrap;
            /* isse item wrap ho jati hai downward */
            /* flex-wrap: nowrap; */
            align-content: flex-start;
            /* now we have more than one line than we use align content center  */
            flex-flow: row wrap;
            /* in this we use first the flex firection then flex wrap   */
            /* gap: 30px; it gives gap horizontaly and verticaly  */
            row-gap: 30px;
            column-gap: 30px;
            /* both work indiviually  */
        }
        .item{
            height: 32px;
            width: 32px;
            background-color: plum;
            border: 2px solid black;
            margin: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
